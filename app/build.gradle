plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.xylotone'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.xylotone"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Внешних библиотек нет: приложение использует только то, что есть в Android.
